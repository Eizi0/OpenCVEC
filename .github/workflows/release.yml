name: Release

on:
  push:
    tags: ["v*"]

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Front
        working-directory: web
        run: npm ci && npm run build
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Binaires (Linux, macOS, Windows)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            name="opencvec_${VERSION}_${os}_${arch}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "build/$name/opencvec$ext" ./cmd/opencvec
            cp README.md LICENSE SECURITY.md .env.example docker-compose.yml "build/$name/"
            if [ "$os" = windows ]; then (cd build && zip -qr "../dist/$name.zip" "$name"); else tar -C build -czf "dist/$name.tar.gz" "$name"; fi
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Étiquettes
        id: tags
        run: |
          v=${GITHUB_REF_NAME#v}
          echo "tags=ghcr.io/eizi0/opencvec:${GITHUB_REF_NAME},ghcr.io/eizi0/opencvec:${v%.*},ghcr.io/eizi0/opencvec:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/Eizi0/OpenCVEC
            org.opencontainers.image.description=Self-hosted CVE checker with canary-based proof
            org.opencontainers.image.licenses=MIT

  release:
    needs: [binaries, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Release GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=".github/release-notes/${TAG}.md"
          [ -f "$notes" ] || { echo "OpenCVEC $TAG" > /tmp/notes.md; notes=/tmp/notes.md; }
          gh release create "$TAG" dist/* --title "OpenCVEC $TAG" --notes-file "$notes"
