# Labo isolé : OpenCVEC + cibles volontairement vulnérables et leurs versions corrigées.
# Les cibles résolvent les noms via le DNS autoritaire d'OpenCVEC (172.30.0.10) : aucun
# trafic de canari ne sort vers Internet. Usage : voir lab/README.md.
name: opencvec-lab

networks:
  lab:
    ipam:
      config:
        - subnet: 172.30.0.0/24

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: opencvec
      POSTGRES_PASSWORD: opencvec
      POSTGRES_DB: opencvec
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencvec -d opencvec"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [lab]

  opencvec:
    build: ..
    depends_on:
      db:
        condition: service_healthy
    environment:
      OPENCVEC_DATABASE_URL: postgres://opencvec:opencvec@db:5432/opencvec?sslmode=disable
      OPENCVEC_SECRET_KEY: bGFiby1vcGVuY3ZlYy1jbGUtZGUtdGVzdC0zMi1vY3Q=
      OPENCVEC_ADMIN_EMAIL: admin@lab.test
      OPENCVEC_ADMIN_PASSWORD: labo-opencvec-2026
      OPENCVEC_CANARY_ZONE: c.opencvec.lab
      OPENCVEC_CANARY_IP: 172.30.0.10
      OPENCVEC_DNS_ADDR: ":53"
      OPENCVEC_CANARY_HTTP_ADDR: ":80"
      OPENCVEC_PROOF_RESOLVERS: 172.30.0.10
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    ports:
      - "127.0.0.1:8095:8080"
    networks:
      lab:
        ipv4_address: 172.30.0.10

  # Log4Shell : Solr 8.11.0 embarque Log4j 2.14.1 (vulnérable).
  solr:
    image: vulhub/solr:8.11.0
    dns: [172.30.0.10]
    networks:
      lab:
        ipv4_address: 172.30.0.20

  # Log4Shell corrigé : Solr 8.11.2 embarque Log4j 2.17.1.
  solr-patched:
    image: solr:8.11.2
    dns: [172.30.0.10]
    networks:
      lab:
        ipv4_address: 172.30.0.21

  # Text4Shell : commons-text 1.9 (vulnérable) et 1.10.0 (corrigé).
  text4shell:
    build: { context: ./text4shell, args: { COMMONS_TEXT: "1.9" } }
    dns: [172.30.0.10]
    networks:
      lab:
        ipv4_address: 172.30.0.30
  text4shell-patched:
    build: { context: ./text4shell, args: { COMMONS_TEXT: "1.10.0" } }
    dns: [172.30.0.10]
    networks:
      lab:
        ipv4_address: 172.30.0.31

  # PHP2Shell (empreinte) : PHP 8.3 antérieur au correctif 8.3.36.
  php-old:
    image: php:8.3.20-apache
    command: ["sh", "-c", "echo '<?php echo \"ok\";' > /var/www/html/index.php && exec apache2-foreground"]
    networks:
      lab:
        ipv4_address: 172.30.0.40

  # Plugin ApacheTraversal (canari fichier) : Apache 2.4.49 vulnérable, 2.4.51 corrigé.
  # Comme l'environnement vulhub d'origine, la protection « Require all denied » de <Directory />
  # est retirée : sans cela, la 2.4.49 n'est pas exploitable.
  httpd:
    image: vulhub/httpd:2.4.49
    command: ["sh", "-c", "sed -i 's/Require all denied/Require all granted/' /usr/local/apache2/conf/httpd.conf && exec httpd-foreground"]
    dns: [172.30.0.10]
    networks:
      lab:
        ipv4_address: 172.30.0.50
  httpd-patched:
    image: httpd:2.4.51
    networks:
      lab:
        ipv4_address: 172.30.0.51

  # Plugin SpringFunction (callback DNS) : Spring Cloud Function 3.2.2 vulnérable.
  spring-function:
    image: vulhub/spring-cloud-function:3.2.2
    dns: [172.30.0.10]
    networks:
      lab:
        ipv4_address: 172.30.0.60

  # Plugin RegreSSHion (empreinte TCP) : OpenSSH 9.6p1 (Alpine 3.19) et 9.9p2 (Alpine 3.21).
  sshd-old:
    build: { context: ./sshd, args: { ALPINE: "3.19" } }
    networks:
      lab:
        ipv4_address: 172.30.0.70
  sshd-new:
    build: { context: ./sshd, args: { ALPINE: "3.21" } }
    networks:
      lab:
        ipv4_address: 172.30.0.71

  # WP2Shell (empreinte) : WordPress 6.9.4 (vulnérable) et 7.0.2 (corrigé), même base, préfixes distincts.
  # Mises à jour automatiques désactivées : sinon WordPress appliquerait lui-même le correctif.
  wp-db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: labo-root
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: labo-wordpress
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [lab]
  wp-old:
    image: wordpress:6.9.4-apache
    depends_on: { wp-db: { condition: service_healthy } }
    environment: &wpenv
      WORDPRESS_DB_HOST: wp-db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: labo-wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_TABLE_PREFIX: wpold_
      WORDPRESS_CONFIG_EXTRA: "define('AUTOMATIC_UPDATER_DISABLED', true); define('WP_AUTO_UPDATE_CORE', false);"
    networks:
      lab:
        ipv4_address: 172.30.0.80
  wp-new:
    image: wordpress:7.0.2-apache
    depends_on: { wp-db: { condition: service_healthy } }
    environment:
      <<: *wpenv
      WORDPRESS_TABLE_PREFIX: wpnew_
    networks:
      lab:
        ipv4_address: 172.30.0.81
